name: simcore-n8n-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: simcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simcore
      POSTGRES_USER: simcore
      POSTGRES_PASSWORD: simcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simcore -d simcore"]
      interval: 10s
      timeout: 5s
      retries: 10

  simcore-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simcore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      SIMCORE_API_HOST: "0.0.0.0"
      SIMCORE_API_PORT: "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: simcore
      DB_POSTGRESDB_USER: simcore
      DB_POSTGRESDB_PASSWORD: simcore
      N8N_ENCRYPTION_KEY: change-me-please
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
